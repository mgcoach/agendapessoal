<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Agenda Pessoal</title>
<meta name="theme-color" content="#f2f3f9" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f2f3f9; --card:rgba(255,255,255,.74); --solid:#ffffff; --ink:#11132a; --ink2:#464b6c; --muted:#8b90ad; --line:rgba(17,19,42,.08); --line2:#e4e6f1;
  --accent:#5b5bf0; --accent2:#8b7bff; --sky:#38bdf8; --accent-soft:#ecebff; --ok:#10b981; --ok-soft:#e3f7ef; --danger:#ef4466; --danger-soft:#fdebef;
  --grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#0ea5e9 120%);
  --glow:rgba(91,91,240,.32);
  --shadow:0 1px 1px rgba(17,19,42,.03),0 8px 28px rgba(40,44,90,.07);
  --shadow-lg:0 18px 50px rgba(30,30,80,.18);
  --r:24px; --nav:78px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --serif: ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --round: ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#090a14; --card:rgba(26,28,50,.66); --solid:#16182c; --ink:#eef0ff; --ink2:#c4c8e6; --muted:#7f84a6; --line:rgba(255,255,255,.07); --line2:#272a46;
  --accent-soft:#1f1f45; --ok-soft:#0d2a22; --danger-soft:#2d1420; --glow:rgba(124,92,255,.35);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.3); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 30% at 12% 6%,rgba(139,123,255,.28),transparent 70%),radial-gradient(34% 28% at 92% 12%,rgba(56,189,248,.22),transparent 70%),radial-gradient(40% 30% at 70% 96%,rgba(236,72,153,.13),transparent 70%);
  animation:drift 24s ease-in-out infinite alternate}
[data-theme="dark"] body:before{opacity:.75}
@keyframes drift{to{transform:translate3d(3%,2%,0) scale(1.06)}}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
.hide{display:none!important}
.glass{background:var(--card);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line)}

/* ---------- layout ---------- */
.app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 16px) 18px calc(var(--nav) + var(--safe-b) + 30px)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 2px 18px}
.top h1{font-family:var(--serif);font-size:32px;line-height:1.08;margin:0;letter-spacing:-.5px;font-weight:600}
.top h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.top .sub{color:var(--muted);font-size:15px;margin-top:6px}
.top .sub::first-letter,.cal-head b::first-letter{text-transform:uppercase}
.iconbtn{width:44px;height:44px;border-radius:15px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;flex:none;transition:transform .15s}
.iconbtn:active{transform:scale(.92) rotate(-12deg)}
.iconbtn svg{width:21px;height:21px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:26px 4px 11px}
.section-h h3{margin:0;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.section-h .link{color:var(--accent);font-weight:650;font-size:14px}
.view{animation:fade .32s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.list>*{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.list>*:nth-child(2){animation-delay:.04s}.list>*:nth-child(3){animation-delay:.08s}.list>*:nth-child(4){animation-delay:.12s}.list>*:nth-child(5){animation-delay:.16s}.list>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- strip de dias ---------- */
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.sday{flex:none;width:54px;padding:10px 0 9px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:start;transition:transform .15s}
.sday:active{transform:scale(.94)}
.sday small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.sday b{font-size:19px;font-weight:700;font-family:var(--round)}
.sday .mini{width:26px;height:26px}
.sday .mini svg{width:26px;height:26px;transform:rotate(-90deg)}
.sday.on{background:var(--grad);color:#fff;box-shadow:0 10px 24px var(--glow);border-color:transparent}
.sday.on small{color:rgba(255,255,255,.8)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 20px 20px;color:#fff;background:#14132e;box-shadow:0 20px 44px rgba(20,19,60,.35)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(36px);opacity:.85;pointer-events:none}
.hero:before{width:240px;height:240px;right:-70px;top:-90px;background:radial-gradient(circle,#7c3aed,transparent 65%);animation:orb 9s ease-in-out infinite alternate}
.hero:after{width:220px;height:220px;left:-60px;bottom:-110px;background:radial-gradient(circle,#0ea5e9,transparent 65%);animation:orb 11s ease-in-out infinite alternate-reverse}
@keyframes orb{to{transform:translate(-30px,24px) scale(1.15)}}
.hero-row{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:98px;height:98px;flex:none}
.ring svg{width:98px;height:98px;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--round)}
.ring .lbl b{font-size:25px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.ring .lbl span{font-size:11px;opacity:.75}
.hero .next-k{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;opacity:.7;font-weight:700}
.hero .next-t{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.18;margin:5px 0 6px}
.hero .next-w{font-size:14px;opacity:.85}
.hero-stats{display:flex;gap:8px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:#fff}
button.pill{background:#fff;color:#14132e;border-color:#fff}

.card{background:var(--card);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.vac{display:flex;align-items:center;gap:14px}
.vac .bar{flex:1;height:8px;border-radius:9px;background:var(--line2);overflow:hidden}
.vac .bar i{display:block;height:100%;background:var(--grad);border-radius:9px}
.vac small{color:var(--muted);font-size:13px;white-space:nowrap}

.banner{display:flex;gap:12px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:14px;font-size:14px;line-height:1.38;color:var(--ink2)}
.banner b{color:var(--ink)}
.banner .x{margin-left:auto;color:var(--muted);font-size:22px;padding:0 4px}

/* ---------- task + swipe ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.swipe{position:relative;border-radius:22px}
.sw-bg{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700;font-size:14px;color:#fff;overflow:hidden;opacity:0;transition:opacity .15s}
.sw-bg .l,.sw-bg .r{display:flex;align-items:center;gap:6px;transition:transform .15s}
.swipe.dragging .sw-bg{opacity:1}
.swipe.to-r .sw-bg{background:linear-gradient(90deg,#10b981,#34d399)}
.swipe.to-l .sw-bg{background:linear-gradient(270deg,#6366f1,#38bdf8)}
.swipe.to-r .sw-bg .r,.swipe.to-l .sw-bg .l{opacity:0}
.swipe.armed .sw-bg .l,.swipe.armed .sw-bg .r{transform:scale(1.15)}
.task{--c:var(--accent);position:relative;display:flex;gap:12px;align-items:stretch;background:var(--solid);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:14px 14px 14px 0;overflow:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1.2), opacity .3s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swipe.dragging .task{transition:none}
.task:before{content:"";width:4px;margin:4px 0;border-radius:0 6px 6px 0;background:var(--c);flex:none;box-shadow:0 0 14px var(--c)}
.t-time{width:50px;flex:none;text-align:center;padding-top:1px}
.t-time b{display:block;font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.t-time span{font-size:11px;color:var(--muted)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:650;font-size:16px;line-height:1.3;word-wrap:break-word}
.t-desc{color:var(--ink2);font-size:14px;line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--ink) 5%,transparent);color:var(--ink2)}
.tag.c{background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.tag svg{width:12px;height:12px}
.check{width:34px;height:34px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 50%,var(--line2));flex:none;align-self:center;display:grid;place-items:center;transition:all .25s cubic-bezier(.2,.9,.3,1.4)}
.check svg{width:18px;height:18px;opacity:0;transform:scale(.3) rotate(-30deg);transition:all .25s;color:#fff}
.task.done{opacity:.55}
.task.done .t-title{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--muted)}
.task.done .check{background:linear-gradient(135deg,#34d399,#10b981);border-color:transparent;box-shadow:0 6px 14px rgba(16,185,129,.35)}
.task.done .check svg{opacity:1;transform:none}
.task.late .t-time b{color:var(--danger)}
.check.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{40%{transform:scale(1.3)}}
.swipe-hint{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 0}

.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty .em{font-size:44px;margin-bottom:8px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px;font-family:var(--serif);font-weight:600}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.5}
.empty p b{display:inline;font:inherit;font-weight:700;color:var(--ink);margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:16px;font-weight:650;font-size:16px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 10px 24px var(--glow)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:13px}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:8px 14px calc(10px + var(--safe-b));display:flex;justify-content:center;pointer-events:none}
.nav-in{pointer-events:auto;position:relative;width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-around;height:66px;border-radius:26px;
  background:color-mix(in srgb,var(--solid) 72%,transparent);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--muted);width:60px;padding:6px 0;position:relative;transition:color .2s}
.nav button svg{width:23px;height:23px;transition:transform .25s cubic-bezier(.2,.9,.3,1.5)}
.nav button.on{color:var(--accent)}
.nav button.on svg{transform:translateY(-2px) scale(1.08)}
.nav button.on:after{content:"";position:absolute;bottom:-3px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.nav .fab{width:58px;height:58px;border-radius:20px;background:var(--grad);color:#fff;box-shadow:0 12px 26px var(--glow);display:grid;place-items:center;margin-top:-28px;padding:0;transition:transform .2s}
.nav .fab:active{transform:scale(.9) rotate(90deg)}
.nav .fab svg{width:28px;height:28px}

/* ---------- sheet ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--bg);border-radius:30px 30px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.3,1);padding:10px 18px calc(24px + var(--safe-b));box-shadow:var(--shadow-lg)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-size:27px;font-weight:600;margin:2px 2px 16px;letter-spacing:-.4px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 4px 8px;text-transform:uppercase;letter-spacing:1px}
.inp{width:100%;background:var(--solid);border:1.5px solid var(--line2);border-radius:16px;padding:14px 15px;font-size:16px;outline:none;transition:border .15s, box-shadow .15s;-webkit-appearance:none;appearance:none;min-height:52px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
.inp.big{font-size:19px;font-weight:650}
textarea.inp{resize:none;min-height:84px;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:13px;background:var(--solid);border:1.5px solid var(--line2);font-size:14px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;transition:all .18s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.col.on{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 35%,transparent)}
.chip.day{width:40px;padding:0;justify-content:center}
.chip.swatch,.chip.swatch.on{background:var(--c);border-color:transparent;border-radius:50%}
.chip.swatch.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.switch-row{display:flex;align-items:center;gap:12px;background:var(--solid);border:1.5px solid var(--line2);border-radius:18px;padding:12px 14px;cursor:pointer}
.switch-row .txt{flex:1;font-size:15px;font-weight:600;line-height:1.3}
.switch-row .txt small{display:block;color:var(--muted);font-weight:500;font-size:13px;margin-top:2px}
.sw{width:52px;height:32px;border-radius:20px;background:var(--line2);position:relative;flex:none;transition:background .25s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.sw.on{background:var(--grad)}
.sw.on:after{transform:translateX(20px)}
.sub-box{margin-top:10px;padding:12px;border-radius:18px;background:color-mix(in srgb,var(--ink) 4%,transparent)}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 4px 0}
.quick{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick .chip{flex:none;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- dialog / toast ---------- */
.dlg-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(10,10,30,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.dlg-wrap.open{opacity:1;pointer-events:auto}
.dlg{background:var(--solid);border-radius:26px;padding:22px;max-width:360px;width:100%;box-shadow:var(--shadow-lg);transform:scale(.92);transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.dlg-wrap.open .dlg{transform:none}
.dlg h4{margin:0 0 8px;font-size:21px;font-family:var(--serif);font-weight:600}
.dlg p{margin:0 0 18px;color:var(--ink2);line-height:1.5;font-size:15px}
.dlg .btns{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 24px);transform:translate(-50%,30px) scale(.96);z-index:80;background:rgba(17,19,42,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:18px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 36px);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#a5b4fc;font-weight:800}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-family:var(--serif);font-size:22px;font-weight:600;display:block}
.cal-head .nv{display:flex;gap:6px}
.cal-head .nv button{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,transparent);display:grid;place-items:center}
.cal-head .nv svg{width:18px;height:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0 8px;letter-spacing:.5px}
.dcell{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px;position:relative;transition:transform .15s,background .2s}
.dcell:active{transform:scale(.9)}
.dcell.out{opacity:.28}
.dcell.today{color:var(--accent);font-weight:800}
.dcell.today:before{content:"";position:absolute;inset:3px;border-radius:12px;border:1.5px solid var(--accent)}
.dcell.sel{background:var(--grad);color:#fff;box-shadow:0 8px 18px var(--glow)}
.dcell.sel:before{display:none}
.dcell.vac{background:color-mix(in srgb,var(--sky) 12%,transparent)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c)}

<script>
/* =========================================================
   Agenda de Estudos — PWA (arquivo único, dados no aparelho)
   ========================================================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const diffDays = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const TYPES = [
  { id: 'leitura', label: 'Leitura', emoji: '📖', color: '#6366f1' },
  { id: 'revisao', label: 'Revisão', emoji: '🔁', color: '#a855f7' },
  { id: 'resumo', label: 'Resumo', emoji: '✍️', color: '#0ea5e9' },
  { id: 'questoes', label: 'Questões', emoji: '🧠', color: '#ec4899' },
  { id: 'faculdade', label: 'Faculdade', emoji: '🎓', color: '#10b981' },
  { id: 'pessoal', label: 'Pessoal', emoji: '⭐', color: '#f59e0b' },
];
const BOOK_COLORS = ['#6366f1', '#a855f7', '#0ea5e9', '#10b981', '#ec4899', '#f59e0b', '#e5484d', '#14b8a6', '#84cc16', '#334155'];
const DURS = [15, 30, 45, 60, 90, 120];
const REMINDS = [{ v: 0, l: 'Na hora' }, { v: 5, l: '5 min antes' }, { v: 15, l: '15 min' }, { v: 30, l: '30 min' }, { v: 60, l: '1 hora' }, { v: -1, l: 'Sem aviso' }];
const WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
const QUICK = [
  { t: 'Leitura', type: 'leitura', dur: 45 }, { t: 'Revisar anotações', type: 'revisao', dur: 30 },
  { t: 'Fazer resumo do capítulo', type: 'resumo', dur: 45 }, { t: 'Flashcards', type: 'revisao', dur: 20 },
  { t: 'Resolver questões', type: 'questoes', dur: 40 },
];

const I = {
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  rep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>',
  reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  skip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

/* ---------------- storage (IndexedDB, com plano B em localStorage) ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('mg-agenda', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    if (!this.db) { try { return Promise.resolve(JSON.parse(localStorage.getItem('mg-agenda-' + k))); } catch (e) { return Promise.resolve(null); } }
    return new Promise(res => { const r = this.db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
  },
  set(k, v) {
    if (!this.db) { try { localStorage.setItem('mg-agenda-' + k, JSON.stringify(v)); } catch (e) {} return Promise.resolve(); }
    return new Promise(res => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res; });
  }
};

const DEFAULTS = () => ({
  v: 1, tasks: [], books: [], sessions: [], readLog: [], notified: {}, grade: [], gradeDirty: false, gradeApplied: null, gradeSeq: 0, seeds: [],
  settings: { name: 'Matheus', theme: 'light', vacStart: '', vacEnd: '', remind: 15, calDefault: true, notif: false, focus: 25, brk: 5, installHidden: false, vacHidden: false },
  timer: { mode: 'focus', total: 1500, remaining: 1500, endAt: null, ref: '' }
});
let S = DEFAULTS();
let saveT;
const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => DB.set('state', JSON.parse(JSON.stringify(S))), 120); };

/* ---------------- UI state ---------------- */
let view = 'hoje';
let selDate = today();
let calMonth = (() => { const d = new Date(); d.setDate(1); return d; })();
let F = null; // form atual

/* ---------------- helpers de dados ---------------- */
const typeOf = id => TYPES.find(t => t.id === id) || TYPES[0];
const bookOf = id => S.books.find(b => b.id === id);
const bookName = bk => (bk && (bk.short || bk.title)) || '';
const colorOf = t => (t.book && bookOf(t.book)?.color) || typeOf(t.type).color;
const startOf = t => { const d = parseYmd(t.date); if (t.time) { const [h, m] = t.time.split(':').map(Number); d.setHours(h, m, 0, 0); } else d.setHours(23, 59, 0, 0); return d; };
const sortTasks = arr => arr.sort((a, b) => a.date.localeCompare(b.date) || ((a.time || '99') .localeCompare(b.time || '99')) || a.createdAt - b.createdAt);
const tasksOn = d => sortTasks(S.tasks.filter(t => t.date === d));
const overdue = () => sortTasks(S.tasks.filter(t => !t.done && (t.date < today() || (t.date === today() && t.time && startOf(t) < new Date(Date.now() - 60 * 60000) && false))));
const durLabel = m => m >= 60 ? (m % 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${m / 60}h`) : `${m} min`;
const remindLabel = v => v < 0 ? '' : v === 0 ? 'na hora' : v >= 60 ? `${v / 60}h antes` : `${v} min antes`;
function relDay(s) {
  const t = today();
  if (s === t) return 'Hoje'; if (s === addDays(t, 1)) return 'Amanhã'; if (s === addDays(t, -1)) return 'Ontem';
  return cap(parseYmd(s).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, ''));
}
function untilLabel(ms) {
  const m = Math.round(ms / 60000);
  if (m <= 0) return 'agora';
  if (m < 60) return `em ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return `em ${h}h${r ? pad(r) : ''}`;
  return `em ${Math.round(h / 24)} dia(s)`;
}
function activeDays() {
  const set = new Set();
  S.tasks.forEach(t => { if (t.done && t.doneAt) set.add(ymd(new Date(t.doneAt))); });
  S.sessions.forEach(s => set.add(s.date));
  S.readLog.forEach(r => r.pages > 0 && set.add(r.date));
  return set;
}
function streak() {
  const set = activeDays(); let d = today(), n = 0;
  if (!set.has(d)) d = addDays(d, -1);
  while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
const focusMinOn = d => S.sessions.filter(s => s.date === d).reduce((a, s) => a + s.min, 0);

/* ---------------- render principal ---------------- */
function render() {
  $$('.nav [data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === view));
  const fn = { hoje: viewHoje, agenda: viewAgenda, livros: viewLivros, foco: viewFoco }[view];
  $('#app').innerHTML = `<div class="view">${fn()}</div>`;
  if (view === 'foco') paintTimer();
}

function taskCard(t, opts = {}) {
  const c = colorOf(t), ty = typeOf(t.type), b = bookOf(t.book);
  const late = !t.done && (t.date < today() || (t.time && t.date === today() && startOf(t).getTime() + (t.dur || 0) * 60000 < Date.now()));
  const live = !t.done && t.time && t.date === today() && Date.now() >= startOf(t).getTime() && Date.now() < startOf(t).getTime() + (t.dur || 0) * 60000;
  return `<div class="swipe" data-sw="${t.id}"><div class="sw-bg"><span class="l">${I.check} ${t.done ? 'Reabrir' : 'Concluir'}</span><span class="r">Amanhã ${I.right}</span></div><div class="task ${t.done ? 'done' : ''} ${late ? 'late' : ''} ${live ? 'now' : ''}" style="--c:${c}" data-open="${t.id}">
    <div class="t-time">${t.time ? `<b>${t.time}</b><span>${durLabel(t.dur || 30)}</span>` : `<b style="font-size:13px">Dia</b><span>todo</span>`}</div>
    <div class="t-body">
      <div class="t-title">${esc(t.title)}</div>
      ${t.desc ? `<div class="t-desc">${esc(t.desc)}</div>` : ''}
      <div class="t-meta">
        ${live ? '<span class="tag live">Agora</span>' : ''}
        ${opts.showDate ? `<span class="tag">${relDay(t.date)}</span>` : ''}
        <span class="tag c">${b ? '📘 ' + esc(bookName(b)) : ty.emoji + ' ' + ty.label}</span>
        ${t.remind >= 0 && t.time && !t.done ? `<span class="tag">${I.bell}${remindLabel(t.remind)}</span>` : ''}
        ${t.cal ? `<span class="tag">${I.cal}iPhone</span>` : ''}
        ${t.grade ? `<span class="tag">🏫 até ${t.gEnd || ''}</span>` : t.series ? `<span class="tag">${I.rep}</span>` : ''}
      </div>
    </div>
    <button class="check" data-check="${t.id}" aria-label="Concluir">${I.check}</button>
  </div></div>`;
}

function viewHoje() {
  const now = new Date(), t = today();
  const h = now.getHours();
  const greet = h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const list = tasksOn(t);
  const done = list.filter(x => x.done).length;
  const pct = list.length ? done / list.length : 0;
  const late = S.tasks.filter(x => !x.done && x.date < t);
  const pending = list.filter(x => !x.done);
  const upcoming = S.tasks.filter(x => !x.done && startOf(x) >= new Date(now - 15 * 60000)).sort((a, b) => startOf(a) - startOf(b));
  const next = pending.find(x => x.time && startOf(x) >= new Date(now - 15 * 60000)) || pending[0] || upcoming[0];
  const st = streak(), fm = focusMinOn(t);
  const C = 2 * Math.PI * 40;

  const cur = pending.find(x => x.time && startOf(x) <= now && now < startOf(x).getTime() + (x.dur || 0) * 60000);
  let nextHtml;
  if (cur) {
    const end = new Date(startOf(cur).getTime() + cur.dur * 60000);
    nextHtml = `<div class="next-k">● Agora</div><div class="next-t">${esc(cur.title)}</div><div class="next-w">até ${pad(end.getHours())}:${pad(end.getMinutes())} · faltam ${Math.max(1, Math.round((end - now) / 60000))} min</div>`;
  } else if (next) {
    const when = next.date === t ? (next.time ? `${next.time} · ${untilLabel(startOf(next) - now)}` : 'Hoje, sem horário') : `${relDay(next.date)}${next.time ? ' · ' + next.time : ''}`;
    nextHtml = `<div class="next-k">Próxima</div><div class="next-t">${esc(next.title)}</div><div class="next-w">${when}</div>`;
  } else if (list.length && done === list.length) {
    nextHtml = `<div class="next-k">Tudo feito</div><div class="next-t">Dia concluído! 🎉</div><div class="next-w">Aproveite o descanso.</div>`;
  } else {
    nextHtml = `<div class="next-k">Agenda livre</div><div class="next-t">Nada marcado hoje</div><div class="next-w">Toque no + para planejar.</div>`;
  }

  // férias
  let vac = '';
  const { vacStart: vs, vacEnd: ve } = S.settings;
  if (vs && ve && t <= ve) {
    const total = diffDays(vs, ve) + 1, dayN = Math.min(total, Math.max(0, diffDays(vs, t) + 1));
    vac = t < vs
      ? `<div class="card vac"><span style="font-size:22px">🏖️</span><div style="flex:1"><b style="font-size:15px">Férias começam ${untilLabel(parseYmd(vs) - now).replace('em ', 'em ')}</b><div class="hint" style="margin:2px 0 0">${total} dias para estudar no seu ritmo</div></div></div>`
      : `<div class="card vac"><span style="font-size:22px">🏖️</span><div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><b style="font-size:14px">Férias · dia ${dayN} de ${total}</b><small>faltam ${total - dayN} dias</small></div><div class="bar"><i style="width:${dayN / total * 100}%"></i></div></div></div>`;
  } else if (!vs && !S.settings.vacHidden) {
    vac = `<div class="banner"><span style="font-size:24px">🏖️</span><div><b>Quando são suas férias?</b><br>Defina o período para ver o progresso e montar planos de leitura.</div><button class="btn sm primary" data-act="settings" style="margin-left:auto">Definir</button></div>`;
  }

  const install = (isIOS && !isStandalone && !S.settings.installHidden)
    ? `<div class="banner"><span style="font-size:24px">📲</span><div><b>Instale na Tela de Início</b><br>No Safari: <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>. Assim ele abre como app.</div><button class="x" data-act="hideInstall">×</button></div>` : '';

  return `
  <div class="top">
    <div><h1>${greet},<br><em>${esc(S.settings.name || 'você')}</em></h1><div class="sub">${now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes">${I.gear}</button>
  </div>
  ${dayStrip()}
  <div class="hero">
    <div class="hero-row">
      <div class="ring"><svg viewBox="0 0 96 96"><defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/><circle cx="48" cy="48" r="40" fill="none" stroke="url(#hg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}" style="transition:stroke-dashoffset .6s"/></svg>
        <div class="lbl"><div><b>${done}/${list.length}</b><span>tarefas</span></div></div></div>
      <div style="min-width:0">${nextHtml}</div>
    </div>
    <div class="hero-stats">
      <span class="pill">🔥 ${st} ${st === 1 ? 'dia seguido' : 'dias seguidos'}</span>
      <span class="pill">⏱️ ${fm} min de foco</span>
      ${cur || next ? `<button class="pill" data-focus="${(cur || next).id}">▶ ${cur ? 'Focar agora' : 'Focar na próxima'}</button>` : ''}
    </div>
  </div>
  ${install}
  ${vac ? `<div style="margin-top:14px">${vac}</div>` : ''}

  ${late.length ? `<div class="section-h"><h3 style="color:var(--danger)">Atrasadas · ${late.length}</h3><button class="link" data-act="moveLate">Trazer para hoje</button></div>
  <div class="list">${sortTasks(late).map(x => taskCard(x, { showDate: true })).join('')}</div>` : ''}

  ${S.gradeDirty ? `<div class="banner"><span style="font-size:24px">🏫</span><div><b>Sua grade semanal mudou</b><br>Leve as aulas para a agenda para receber os lembretes.</div><button class="btn sm primary" data-ga="apply" style="margin-left:auto">Aplicar</button></div>` : ''}
  <div class="section-h"><h3>Hoje</h3><button class="link" data-act="new">+ Adicionar</button></div>
  ${list.length ? `<div class="list">${list.filter(x => !x.done).map(x => taskCard(x)).join('')}</div>${!S.settings.swipeSeen && list.some(x => !x.done) ? '<p class="swipe-hint">Dica: arraste para a direita para concluir · para a esquerda para adiar</p>' : ''}
     ${done ? `<div class="section-h"><h3>Concluídas · ${done}</h3></div><div class="list">${list.filter(x => x.done).map(x => taskCard(x)).join('')}</div>` : ''}`
    : `<div class="card empty"><div class="em">📚</div><b>Nada para hoje ainda</b><p>Planeje sua leitura, revisões e resumos.<br>Cada tarefa pode te avisar na tela bloqueada.</p><button class="btn primary" data-act="new">${I.plus} Criar tarefa</button></div>`}

  ${(() => { const tm = tasksOn(addDays(t, 1)); return tm.length ? `<div class="section-h"><h3>Amanhã · ${tm.length}</h3></div><div class="list">${tm.slice(0, 4).map(x => taskCard(x)).join('')}</div>` : ''; })()}
  `;
}

function dayStrip() {
  const t = today(), C = 2 * Math.PI * 10;
  return `<div class="strip">${[...Array(14)].map((_, i) => {
    const d = addDays(t, i - 1), ts = tasksOn(d), dn = ts.filter(x => x.done).length, p = ts.length ? dn / ts.length : 0, on = d === t;
    const stroke = on ? '#fff' : (p === 1 ? 'var(--ok)' : 'var(--accent)'), track = on ? 'rgba(255,255,255,.3)' : 'var(--line2)';
    return `<button class="sday ${on ? 'on' : 'card'}" data-goday="${d}" style="${on ? '' : 'padding:10px 0 9px;border-radius:18px'}">
      <small>${parseYmd(d).toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0, 3)}</small><b>${parseYmd(d).getDate()}</b>
      <span class="mini"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="${track}" stroke-width="3"/>${ts.length ? `<circle cx="13" cy="13" r="10" fill="none" stroke="${stroke}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/>` : ''}</svg></span>
    </button>`;
  }).join('')}</div>`;
}


function viewAgenda() {
  const mode = S.settings.agendaMode || 'mes';
  return `
  <div class="top"><div><h1>Agenda</h1><div class="sub">${mode === 'grade' ? 'Sua rotina da semana, como na escola' : 'Planeje a semana com calma'}</div></div>
    <button class="iconbtn" data-act="settings">${I.gear}</button></div>
  <div class="seg wide"><button data-amode="mes" class="${mode === 'mes' ? 'on' : ''}">📅 Calendário</button><button data-amode="grade" class="${mode === 'grade' ? 'on' : ''}">🏫 Grade semanal</button></div>
  ${mode === 'grade' ? viewGrade() : viewMonth()}`;
}

/* ---------------- grade semanal ---------------- */
const WDL = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const WDF = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const toMin = s => { const [h, m] = (s || '0:0').split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const blockColor = b => (b.book && bookOf(b.book)?.color) || typeOf(b.type).color;
const blocksOn = d => S.grade.filter(b => b.day === d).sort((a, b) => toMin(a.start) - toMin(b.start));
const abbr = s => { const w = (s || '').split(/\s+/).filter(x => x.length > 2)[0] || s || ''; return w.length <= 7 ? w : w.slice(0, 5) + '.'; };
const blockShort = b => { const bk = bookOf(b.book); if (bk && (!b.title || b.title === `Ler ${bookName(bk)}` || b.title === `Ler ${bk.title}`)) return bk.short || bk.title.split(/\s+/).filter(w => w.length > 2).slice(0, 2).join(' ') || bk.title; return b.title; };
const markGrade = () => { S.gradeDirty = S.grade.length > 0; };
let gradeDay = new Date().getDay();

function viewGrade() {
  const showWE = S.settings.gradeWeekend || S.grade.some(b => b.day === 0 || b.day === 6);
  const days = showWE ? WEEK : [1, 2, 3, 4, 5];
  const all = S.grade;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), td = now.getDay();
  const minS = all.length ? Math.min(...all.map(b => toMin(b.start))) : 7 * 60;
  const maxE = all.length ? Math.max(...all.map(b => toMin(b.end))) : 12 * 60;
  const h0 = Math.max(0, Math.min(7, Math.floor(minS / 60))), h1 = Math.min(24, Math.max(12, Math.ceil(maxE / 60)));
  const ppm = 1.1, H = (h1 - h0) * 60 * ppm;
  const weekMin = all.reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0);
  const nBooks = new Set(all.map(b => b.book).filter(Boolean)).size;
  const cols = days.map(d => {
    const bl = blocksOn(d).map((b, i) => {
      const s = toMin(b.start), e = toMin(b.end);
      const top = (s - h0 * 60) * ppm, h = Math.max(22, (e - s) * ppm - 3);
      const live = d === td && nowMin >= s && nowMin < e;
      return `<button class="gblk ${live ? 'live' : ''}" data-gblock="${b.id}" style="--c:${blockColor(b)};top:${top}px;height:${h}px;animation-delay:${i * .04}s"><b>${esc(abbr(blockShort(b)))}</b>${h > 36 ? `<span>${b.start}</span>` : ''}${h > 52 ? `<span>${b.end}</span>` : ''}</button>`;
    }).join('');
    const nowLine = d === td && nowMin >= h0 * 60 && nowMin <= h1 * 60 ? `<i class="gnow" style="top:${(nowMin - h0 * 60) * ppm}px"></i>` : '';
    return `<div class="gcol ${d === td ? 'today' : ''}" data-gcol="${d}" data-h0="${h0}" data-ppm="${ppm}" style="height:${H}px">${bl}${nowLine}</div>`;
  }).join('');
  const hours = [...Array(h1 - h0 + 1)].map((_, i) => h0 + i);

  const gridHtml = `<div class="card gwrap">
    <div class="ghead" style="grid-template-columns:32px repeat(${days.length},1fr)"><span></span>${days.map(d => `<span class="${d === td ? 'on' : ''}">${WDL[d]}</span>`).join('')}</div>
    <div class="gbody"><div class="gtimes" style="height:${H}px">${hours.map(h => `<span style="top:${(h - h0) * 60 * ppm}px">${pad(h)}h</span>`).join('')}</div>
      <div class="gcols" style="grid-template-columns:repeat(${days.length},1fr);background:linear-gradient(var(--line2) 1px,transparent 1px) 0 0/100% ${60 * ppm}px">${cols}</div></div>
    <div class="glegend">${[...new Map(all.map(b => [b.book || b.title, b])).values()].slice(0, 8).map(b => `<span><i class="dot" style="--c:${blockColor(b)}"></i>${esc(abbr(blockShort(b)))} = ${esc(blockShort(b))}</span>`).join('')}</div>
    <div class="chips" style="margin-top:12px;justify-content:space-between;align-items:center">
      <button class="chip ${showWE ? 'on' : ''}" data-ga="weekend">${showWE ? '✓ ' : ''}Sáb e Dom</button>
      <span class="hint" style="margin:0">Toque num espaço vazio para criar</span></div>
  </div>`;

  // detalhe do dia
  const bl = blocksOn(gradeDay);
  let dayHtml = '';
  bl.forEach((b, i) => {
    if (i) { const gap = toMin(b.start) - toMin(bl[i - 1].end); if (gap > 0) dayHtml += `<div class="gpause">☕ Pausa · ${durLabel(gap)} <span>${bl[i - 1].end}–${b.start}</span></div>`; else if (gap < 0) dayHtml += `<div class="gpause warn">⚠️ Horários sobrepostos</div>`; }
    const bk = bookOf(b.book), ty = typeOf(b.type), dur = toMin(b.end) - toMin(b.start);
    const live = gradeDay === td && nowMin >= toMin(b.start) && nowMin < toMin(b.end);
    dayHtml += `<div class="task gtask ${live ? 'now' : ''}" style="--c:${blockColor(b)}" data-gblock="${b.id}">
      <div class="t-time"><b>${b.start}</b><span>até ${b.end}</span></div>
      <div class="t-body"><div class="t-title">${esc(b.title || (bk ? 'Ler ' + bookName(bk) : 'Estudo'))}</div>${b.desc ? `<div class="t-desc">${esc(b.desc)}</div>` : ''}
        <div class="t-meta">${live ? '<span class="tag live">Agora</span>' : ''}<span class="tag c">${bk ? '📘 ' + esc(bookName(bk)) : ty.emoji + ' ' + ty.label}</span><span class="tag">${I.clock}${durLabel(dur)}</span>${b.remind >= 0 ? `<span class="tag">${I.bell}${remindLabel(b.remind)}</span>` : ''}</div></div>
    </div>`;
  });
  const dayMin = bl.reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0);

  const status = S.gradeDirty
    ? `<div class="banner" style="margin-top:0;margin-bottom:14px"><span style="font-size:24px">🔔</span><div><b>${S.gradeApplied ? 'Grade alterada' : 'Grade ainda não está na agenda'}</b><br>Aplique para gerar as tarefas e os lembretes.</div></div>`
    : S.gradeApplied && all.length ? `<p class="hint" style="margin:-4px 4px 14px">✅ Na agenda de ${parseYmd(S.gradeApplied.start).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')} a ${parseYmd(S.gradeApplied.end).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '')}</p>` : '';

  if (!all.length) return `
    <div class="card empty"><div class="em">🏫</div><b>Monte sua grade como na escola</b><p>Defina os horários fixos da semana — por exemplo, <b>segunda, 7h às 8h30: Neumann</b>, pausa, <b>9h às 10h30: Haluch</b>. Depois é só aplicar na agenda e receber os lembretes.</p>
      <button class="btn primary block" data-ga="template">✨ Usar modelo: manhãs de leitura</button>
      <button class="btn block" style="margin-top:8px" data-ga="new">${I.plus} Criar do zero</button>
      <p class="hint">O modelo cria Seg a Sex: 7h–8h30 e 9h–10h30${S.books.length ? ', já com seus livros' : ''}. Você ajusta depois.</p></div>`;

  return `
  <div class="stat-row" style="margin-bottom:14px"><div class="stat"><b>${all.length}</b><span>aulas na semana</span></div><div class="stat"><b>${durLabel(weekMin).replace(' min', 'm')}</b><span>de estudo/semana</span></div><div class="stat"><b>${nBooks}</b><span>${nBooks === 1 ? 'livro' : 'livros'} na grade</span></div></div>
  ${status}
  <button class="btn primary block" data-ga="apply" style="margin-bottom:14px">🗓️ ${S.gradeApplied ? 'Reaplicar na agenda' : 'Aplicar na agenda'}</button>
  ${gridHtml}
  <div class="section-h"><h3>${cap(WDF[gradeDay])}${bl.length ? ` · ${bl.length} ${bl.length === 1 ? 'aula' : 'aulas'} · ${durLabel(dayMin)}` : ''}</h3><button class="link" data-ga="new">+ Aula</button></div>
  <div class="chips daypick" style="margin-bottom:12px">${WEEK.map(d => { const n = blocksOn(d).length; return `<button class="chip ${d === gradeDay ? 'on' : ''}" data-gday="${d}">${WDL[d]}${n ? `<small>${n}</small>` : ''}</button>`; }).join('')}</div>
  ${bl.length ? `<div class="list">${dayHtml}</div>
    <div class="g-actions"><button class="btn sm" data-ga="copy">📋 Copiar ${WDL[gradeDay].toLowerCase()} para…</button><button class="btn sm" data-ga="new">${I.plus} Aula</button></div>`
    : `<div class="card empty" style="padding:22px"><div class="em" style="font-size:32px">☀️</div><b>${cap(WDF[gradeDay])} livre</b><p>Nenhuma aula neste dia.</p><button class="btn sm primary" data-ga="new">${I.plus} Adicionar aula</button></div>`}
  `;
}

function openBlockForm(b, preset = {}) {
  const edit = !!b;
  F = { kind: 'block', edit, id: b?.id, days: edit ? [b.day] : (preset.days || [gradeDay]), book: edit ? (b.book || '') : (preset.book ?? (S.books[0]?.id || '')), type: b?.type || 'leitura', remind: b?.remind ?? S.settings.remind };
  const start = b?.start || preset.start || '07:00', end = b?.end || preset.end || fromMin(Math.min(toMin(start) + 90, 1439));
  const bookOpts = [...S.books.map(x => ({ v: x.id, l: esc(bookName(x)), c: x.color })), { v: '', l: '✏️ Outro' }];
  const bk = bookOf(F.book);
  openSheet(`
    <h2>${edit ? 'Editar aula' : 'Nova aula'}</h2>
    ${S.books.length ? `<div class="field"><label>Livro</label>${chipsHtml('book', bookOpts, F.book)}</div>` : ''}
    <div class="field"><input class="inp big" id="gTitle" placeholder="${bk ? esc('Ler ' + bookName(bk)) : 'O que você vai estudar?'}" value="${esc(b && !(bk && b.title === 'Ler ' + bookName(bk)) ? b.title : '')}" maxlength="80" autocomplete="off">
      <div class="hint">Deixe em branco para usar “Ler + nome do livro”.</div></div>

function bookMinutes(id, since) {
  const done = S.tasks.filter(t => t.book === id && t.done && t.time && t.doneAt && (!since || ymd(new Date(t.doneAt)) >= since));
  const days = new Set(done.map(t => ymd(new Date(t.doneAt))));

  }
  return { left, pct, goal };
}

}
function closeSheet() { $('#overlay').classList.remove('open'); $('#sheet').classList.remove('open'); document.body.classList.remove('lock'); F = null; }
function ask({ title, text = '', buttons }) {

    $('#dlgBox').innerHTML = `<h4>${title}</h4>${text ? `<p>${text}</p>` : ''}<div class="btns">${buttons.map((b, i) => `<button class="btn block ${b.style || ''}" data-i="${i}">${b.label}</button>`).join('')}</div>`;

function confetti() {

  for (let i = 0; i < 70; i++) {
    const s = document.createElement('i'); s.className = 'confetti';

    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = Math.random() * .4 + 's'; s.style.animationDuration = 1.3 + Math.random() * .9 + 's';

/* ---------------- ações de tarefa ---------------- */
function toggleDone(id, el) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null;
  const b = bookOf(t.book);
  if (b && t.pageTo) {
    if (t.done && t.pageTo > b.page) { S.readLog.push({ date: today(), book: b.id, pages: t.pageTo - b.page, task: t.id }); t._prevPage = b.page; b.page = Math.min(b.pages, t.pageTo); }
    else if (!t.done && t._prevPage != null && b.page === Math.min(b.pages, t.pageTo)) { S.readLog = S.readLog.filter(r => r.task !== t.id); b.page = t._prevPage; delete t._prevPage; }
  }
  vib(t.done ? 18 : 8);
  if (el) { el.classList.add('pop'); }
  persist();
  setTimeout(() => {
    render();
    if (t.done) {
      const td = tasksOn(today());
      if (t.date === today() && td.length > 1 && td.every(x => x.done)) { confetti(); toast('Dia concluído! Você mandou bem 🎉'); }
      else toast('Concluída ✓', { label: 'Desfazer', fn: () => toggleDone(id) });
    }
  }, el ? 220 : 0);
}
async function deleteTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  let mode = 'one';
  if (t.series) {
    const n = S.tasks.filter(x => x.series === t.series && x.date >= t.date).length;
    mode = await ask({ title: 'Excluir tarefa repetida', text: `Esta tarefa faz parte de uma série.`, buttons: [{ label: 'Só esta', value: 'one' }, { label: `Esta e as próximas (${n})`, value: 'next', style: 'danger' }, { label: 'Cancelar', value: null, style: 'ghost' }] });
    if (!mode) return;
  } else {
    const ok = await ask({ title: 'Excluir tarefa?', text: esc(t.title), buttons: [{ label: 'Excluir', value: true, style: 'danger' }, { label: 'Cancelar', value: false, style: 'ghost' }] });
    if (!ok) return;
  }
  const backup = JSON.stringify(S.tasks);
  S.tasks = mode === 'next' ? S.tasks.filter(x => !(x.series === t.series && x.date >= t.date)) : S.tasks.filter(x => x.id !== id);
  persist(); closeSheet(); render();
  toast(t.cal ? 'Excluída (apague também no Calendário)' : 'Tarefa excluída', { label: 'Desfazer', fn: () => { S.tasks = JSON.parse(backup); persist(); render(); } });
}

function planDates() {
  const out = []; let d = F.start;
  const nowHM = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
  for (let i = 0; i < 400 && d <= F.end; i++) { if (F.days.includes(parseYmd(d).getDay()) && !(d === today() && F.time <= nowHM)) out.push(d); d = addDays(d, 1); }
  return out;
}
function updPlan() {
  F.start = $('#pStart').value || today(); F.end = $('#pEnd').value || F.start; F.time = $('#pTime').value || '09:00';
  const b = bookOf(F.id), left = b.pages - b.page, n = planDates().length;
  $('#pPrev').innerHTML = !n ? 'Escolha dias dentro do período.' : left <= 0 ? 'Este livro já foi concluído 🎉' :
    `<b>${Math.ceil(left / n)} páginas</b> por sessão<br>${n} sessões · de ${parseYmd(F.start).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })} a ${parseYmd(F.end).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' })}`;
}
async function savePlan() {
  updPlan();
  const b = bookOf(F.id), dates = planDates(), left = b.pages - b.page;
  if (!dates.length || left <= 0) return;
  const existing = S.tasks.filter(t => t.book === b.id && t.plan && !t.done && t.date >= today());
  if (existing.length) {
    const r = await ask({ title: 'Já existe um plano', text: `Há ${existing.length} sessões futuras deste livro. Substituir pelo novo plano?`, buttons: [{ label: 'Substituir', value: 'rep', style: 'primary' }, { label: 'Manter as duas', value: 'keep' }, { label: 'Cancelar', value: null, style: 'ghost' }] });
    if (!r) return;
    if (r === 'rep') S.tasks = S.tasks.filter(t => !existing.includes(t));
  }
  const per = Math.ceil(left / dates.length), series = uid();
  const short = b.title.length > 30 ? b.title.split(/\s+/).slice(0, 3).join(' ') + '…' : b.title;
  let p = b.page;
  const created = [];
  dates.forEach(d => {
    if (p >= b.pages) return;
    const from = p + 1, to = Math.min(b.pages, p + per); p = to;
    created.push({ id: uid(), title: `Ler ${short}`, desc: `Páginas ${from}–${to} (${to - from + 1} págs)`, date: d, time: F.time, dur: F.dur, type: 'leitura', book: b.id, remind: F.remind, done: false, doneAt: null, series, plan: true, pageFrom: from, pageTo: to, cal: F.cal, createdAt: Date.now() });
  });
  S.tasks.push(...created);
  if (F.cal) exportICS(created, `plano-${slug(b.title)}`);
  persist(); closeSheet(); render(); toast(`${created.length} sessões criadas 🗓️`);
}

/* ---------------- Calendário (.ics) ---------------- */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
function icsFold(line) { const out = []; while (line.length > 60) { out.push(line.slice(0, 60)); line = ' ' + line.slice(60); } out.push(line); return out.join('\r\n'); }
const icsLocal = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsUTC = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
function buildICS(tasks) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MG Agenda de Estudos//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Agenda Pessoal'];
  const stamp = icsUTC(new Date());
  tasks.forEach(t => {
    const b = bookOf(t.book), ty = typeOf(t.type);
    const desc = [t.desc, b ? `Livro: ${b.title}` : '', `${ty.emoji} ${ty.label}`].filter(Boolean).join('\n');
    L.push('BEGIN:VEVENT', `UID:${t.id}@mg-agenda`, `DTSTAMP:${stamp}`);
    if (t.time) {
      const s = startOf(t), e = new Date(s.getTime() + (t.dur || 30) * 60000);
      L.push(`DTSTART:${icsLocal(s)}`, `DTEND:${icsLocal(e)}`);
    } else {
      const d = parseYmd(t.date);
      L.push(`DTSTART;VALUE=DATE:${t.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(t.date, 1).replace(/-/g, '')}`);
    }
    L.push(`SUMMARY:${icsEsc((ty.emoji) + ' ' + t.title)}`, `DESCRIPTION:${icsEsc(desc)}`, 'CATEGORIES:Estudos', 'STATUS:CONFIRMED', 'TRANSP:OPAQUE');
    const alarm = trig => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(t.title)}`, trig, 'END:VALARM');
    if (t.time) {
      if (t.remind > 0) alarm(`TRIGGER:-PT${t.remind}M`);
      if (t.remind >= 0) alarm('TRIGGER:PT0M');
    } else {
      const d = parseYmd(t.date); d.setHours(8, 0, 0, 0); alarm(`TRIGGER;VALUE=DATE-TIME:${icsUTC(d)}`);
    }
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}
function exportICS(tasks, name) {
  if (!tasks.length) return;
  tasks.forEach(t => t.cal = true);
  const blob = new Blob([buildICS(tasks)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name + '.ics'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function downloadFile(text, name, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

    else if (a === 'tToggle') { const T = S.timer; if (T.endAt) { T.remaining = timerRemaining(); T.endAt = null; } else { T.endAt = Date.now() + T.remaining * 1000; if ('Notification' in window && Notification.permission === 'default' && isStandalone) Notification.requestPermission(); } persist(); paintTimer(); }
    else if (a === 'tReset') { setMode(S.timer.mode); paintTimer(); }
    else if (a === 'tSkip') { const T = S.timer; if (T.mode === 'focus' && T.endAt) { const done = T.total - timerRemaining(); if (done >= 60) S.sessions.push({ id: uid(), date: today(), min: Math.round(done / 60), ref: T.ref, at: Date.now() }); } setMode(T.mode === 'focus' ? 'break' : 'focus'); render(); }
  }
});
document.addEventListener('input', e => {
  if (!F) return;
  if (e.target.id === 'fUntil' || e.target.id === 'fDate') { F.until = $('#fUntil')?.value || F.until; F.date = $('#fDate').value || F.date; updateRepCount(); }
  if (F.kind === 'plan' && ['pStart', 'pEnd', 'pTime'].includes(e.target.id)) updPlan();
  if (e.target.id === 'lPage') updLog();
  if (F.kind === 'apply' && ['aStart', 'aEnd'].includes(e.target.id)) updApply();
});
document.addEventListener('change', e => {
  if (e.target.id !== 'sImport') return;
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result); if (!data.tasks || !data.settings) throw 0;
      const ok = await ask({ title: 'Restaurar backup?', text: `${data.tasks.length} tarefas e ${data.books?.length || 0} livros. Os dados atuais serão substituídos.`, buttons: [{ label: 'Restaurar', value: 1, style: 'primary' }, { label: 'Cancelar', value: 0, style: 'ghost' }] });
      if (!ok) return;
      S = Object.assign(DEFAULTS(), data); S.settings = Object.assign(DEFAULTS().settings, data.settings);
      persist(); applyTheme(); closeSheet(); render(); toast('Backup restaurado ✓');
    } catch (err) { toast('Arquivo inválido'); }
  };
  r.readAsText(file);
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { timerTick(); checkReminders(); render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------------- estante inicial (livros do Matheus) ---------------- */
const SEED_BOOKS = { id: 'estante-2026-11', books: [
  { title: 'Princípios de Bioquímica de Lehninger', short: 'Lehninger', author: 'David L. Nelson e Michael M. Cox', ed: '6ª ed. · Artmed · 2014', pages: 1328, color: '#e5484d' },
  { title: 'Prática da Reabilitação Musculoesquelética', short: 'Magee', author: 'David J. Magee, James E. Zachazewski e William S. Quillen', ed: 'Manole · 2013', pages: 818, color: '#14b8a6' },
  { title: 'Fundamentos do Treinamento de Força Muscular', short: 'Fleck & Kraemer', author: 'Steven J. Fleck e William J. Kraemer', ed: '4ª ed. · Artmed · 2017', pages: 472, color: '#f59e0b' },
  { title: 'Guyton & Hall · Tratado de Fisiologia Médica', short: 'Guyton', author: 'John E. Hall e Michael E. Hall', ed: '14ª ed. · GEN Guanabara Koogan · 2021', pages: 1120, color: '#6366f1' },
  { title: 'Biomecânica Básica', short: 'Susan Hall', author: 'Susan J. Hall', ed: '8ª ed. · Guanabara Koogan · 2020', pages: 432, color: '#0ea5e9' },
  { title: 'Periodização Esportiva: Modalidades Individuais e Coletivas', short: 'Periodização', author: 'Charles Ricardo Lopes e Jonato Prestes (org.)', ed: 'Manole · 2025', pages: 256, color: '#ec4899' },
  { title: 'Biomecânica da Musculação e Dieta para Mulheres', short: 'Maia & Paes', author: 'Alexandre Maia e Santiago Paes', ed: '', pages: 288, color: '#84cc16' },
  { title: 'Hipertrofia Muscular: Ciência e Prática', short: 'Schoenfeld', author: 'Brad Schoenfeld', ed: '2ª ed. · Manole · 2022', pages: 368, color: '#a855f7' },
  { title: 'Fisiologia do Exercício: Teoria e Aplicação ao Condicionamento e ao Desempenho', short: 'Powers', author: 'Scott K. Powers, Edward T. Howley e John C. Quindry', ed: '12ª ed. · Manole · 2025', pages: 720, color: '#10b981' },
] };
function seedBooks() {
  S.seeds = S.seeds || [];
  if (S.seeds.includes(SEED_BOOKS.id)) return;
  const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 24);
  const have = new Set(S.books.map(b => norm(b.title)));
  let n = 0;
  SEED_BOOKS.books.forEach(b => { if (!have.has(norm(b.title))) { S.books.push({ id: uid(), ...b, page: 0, goal: '', createdAt: Date.now() + n }); n++; } });
  S.seeds.push(SEED_BOOKS.id);
  persist();
}

/* ---------------- início ---------------- */
(async function init() {
  await DB.open();
  const saved = await DB.get('state');
  if (saved) { S = Object.assign(DEFAULTS(), saved); S.settings = Object.assign(DEFAULTS().settings, saved.settings || {}); S.timer = Object.assign(DEFAULTS().timer, saved.timer || {}); }
  seedBooks();
  applyTheme();
  if (S.timer.endAt && Date.now() >= S.timer.endAt) finishTimer();
  render();
  tickI = setInterval(timerTick, 500);
  setInterval(checkReminders, 20000); checkReminders();
  let lastDay = today(); setInterval(() => { if (today() !== lastDay) { lastDay = today(); if (selDate < lastDay) selDate = lastDay; render(); } else if (view === 'hoje' && !$('#sheet').classList.contains('open')) render(); }, 60000);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
})();
</script>
